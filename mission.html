<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마크다운 미션 실습 — 기초 · 중급 · 고급</title>
<style>
  :root{
    --bg:#f7f5fc; --card:#ffffff; --ink:#2a2438; --sub:#6d6580;
    --line:#e8e3f4; --accent:#8b5cf6; --accent-deep:#6d3ef0; --accent-soft:#f1ecfd;
    --ok:#1a9e6c; --ok-soft:#e6f6ef;
    --code-bg:#f4f1fb; --radius:14px;
    font-size:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif; background:var(--bg); color:var(--ink); line-height:1.65;}
  header{background:var(--card); border-bottom:1px solid var(--line); padding:14px 24px; display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:20;}
  .chapter-chip{font-size:.7rem; font-weight:700; color:#fff; background:var(--accent); border-radius:99px; padding:4px 12px; flex-shrink:0;}
  header h1{font-size:1.05rem; font-weight:800;}
  header .sub{font-size:.78rem; color:var(--sub);}
  .progress-wrap{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:.85rem; color:var(--sub);}
  .bar{width:150px; height:8px; background:var(--line); border-radius:99px; overflow:hidden;}
  .bar i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-deep)); border-radius:99px; transition:width .3s;}
  .layout{display:flex; max-width:1400px; margin:0 auto; min-height:calc(100vh - 61px);}
  nav{width:270px; flex-shrink:0; padding:20px 12px; border-right:1px solid var(--line); background:var(--card);}
  nav .lv{font-size:.7rem; font-weight:800; color:var(--accent-deep); letter-spacing:.05em; margin:16px 8px 6px;}
  nav button{display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:9px 10px; border:none; background:none; border-radius:10px; font-size:.85rem; color:var(--ink); cursor:pointer; font-family:inherit;}
  nav button:hover{background:var(--accent-soft);}
  nav button.active{background:var(--accent); color:#fff; font-weight:600;}
  nav button .done{margin-left:auto; color:var(--ok); font-weight:700;}
  nav button.active .done{color:#e5d9fd;}
  main{flex:1; padding:24px; min-width:0;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; margin-bottom:16px;}
  .lesson-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .badge{font-size:.7rem; font-weight:700; padding:3px 10px; border-radius:99px; background:var(--accent-soft); color:var(--accent-deep);}
  .booknum{font-size:.7rem; font-weight:700; padding:3px 8px; border-radius:6px; background:var(--accent); color:#fff;}
  .lesson-head h2{font-size:1.25rem;}
  .intro{margin-top:10px; font-size:.95rem;}
  .intro p{margin:8px 0;}
  .intro code, .task code{background:var(--code-bg); padding:2px 6px; border-radius:6px; font-size:.85em; font-family:Consolas,Menlo,monospace;}
  .intro pre{background:var(--code-bg); border-radius:10px; padding:12px 14px; margin:10px 0; overflow-x:auto; font-size:.85rem; font-family:Consolas,Menlo,monospace; line-height:1.55;}
  .intro table{border-collapse:collapse; margin:10px 0; font-size:.88rem;}
  .intro th,.intro td{border:1px solid #d5cbee; padding:6px 14px;}
  .intro th{background:var(--accent-soft);}
  .tip{background:#faf7ff; border:1.5px solid #ddc9ff; border-radius:12px; padding:12px 16px; margin:12px 0; font-size:.88rem;}
  .tip .tiptitle{display:inline-block; font-weight:800; color:#fff; background:var(--accent-deep); border-radius:8px; padding:2px 10px; font-size:.75rem; margin-bottom:6px;}
  .task{background:var(--accent-soft); border-radius:10px; padding:14px 16px; margin-top:14px; font-size:.93rem;}
  .task strong{color:var(--accent-deep);}
  .work{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:900px){ .work{grid-template-columns:1fr;} .layout{flex-direction:column;} nav{width:100%; display:flex; flex-wrap:wrap; border-right:none; border-bottom:1px solid var(--line);} nav .lv{width:100%;} nav button{width:auto;} }
  .pane{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column;}
  .pane-title{font-size:.78rem; font-weight:700; color:var(--sub); padding:10px 14px; border-bottom:1px solid var(--line); background:#fbf9ff; display:flex; align-items:center;}
  .pane-title .hintbtn{margin-left:auto; font-size:.75rem; border:1px solid var(--line); background:#fff; border-radius:8px; padding:3px 10px; cursor:pointer; color:var(--sub); font-family:inherit;}
  textarea{width:100%; flex:1; min-height:320px; border:none; resize:vertical; padding:14px; font-family:Consolas,Menlo,'Malgun Gothic',monospace; font-size:.9rem; line-height:1.7; outline:none; color:var(--ink); background:#fff;}
  .preview{padding:14px 16px; min-height:320px; font-size:.92rem; overflow-x:auto;}
  .preview h1{font-size:1.5rem; margin:.5em 0 .35em;}
  .preview h2{font-size:1.25rem; margin:.6em 0 .3em;}
  .preview h3{font-size:1.05rem; margin:.6em 0 .3em;}
  .preview h4{font-size:.95rem; margin:.6em 0 .3em;}
  .preview p{margin:.45em 0;}
  .preview ul,.preview ol{margin:.45em 0 .45em 1.5em;}
  .preview li{margin:.15em 0;}
  .preview li.task-item{list-style:none; margin-left:-1.2em;}
  .preview blockquote{border-left:4px solid var(--accent); background:var(--accent-soft); padding:8px 14px; border-radius:0 8px 8px 0; margin:.6em 0; color:#4a3f6b;}
  .preview blockquote p{margin:.15em 0;}
  .preview hr{border:none; border-top:2px solid #d8cef0; margin:1em 0;}
  .preview mark{background:#f3e88a; border-radius:3px; padding:0 2px;}
  .preview code{background:var(--code-bg); padding:2px 6px; border-radius:6px; font-size:.85em; font-family:Consolas,Menlo,monospace;}
  .preview pre{background:var(--code-bg); border-radius:10px; padding:12px 14px; margin:.6em 0; overflow-x:auto; position:relative;}
  .preview pre code{background:none; padding:0;}
  .preview pre .lang{position:absolute; top:6px; right:10px; font-size:.7rem; color:var(--accent-deep); font-weight:700;}
  .preview a{color:var(--accent-deep);}
  .preview del{color:var(--sub);}
  .checks{margin-top:16px;}
  .checks h3{font-size:.9rem; margin-bottom:8px;}
  .check{display:flex; gap:10px; align-items:flex-start; padding:7px 12px; border-radius:10px; font-size:.9rem; color:var(--sub); margin-bottom:4px; background:#fbf9ff; border:1px solid var(--line);}
  .check.pass{background:var(--ok-soft); color:var(--ok); border-color:#bfe8d6; font-weight:600;}
  .check .mark{font-weight:700; width:1.2em; flex-shrink:0;}
  .hint{display:none; margin-top:12px; background:#fff8ed; border:1px solid #f3dfc0; border-radius:10px; padding:12px 16px; font-size:.88rem; color:#7c5a1e;}
  .hint.show{display:block;}
  .hint pre{background:#fff; border-radius:8px; padding:10px 12px; margin-top:8px; font-family:Consolas,Menlo,monospace; font-size:.83rem; overflow-x:auto; color:#444; white-space:pre;}
  .footer-nav{display:flex; gap:12px; margin-top:18px; align-items:center; flex-wrap:wrap;}
  .btn{font-family:inherit; font-size:.92rem; font-weight:600; border-radius:10px; cursor:pointer; padding:10px 20px; border:1px solid var(--line); background:var(--card); color:var(--ink);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:disabled{background:#cbb8f5; border-color:#cbb8f5; cursor:not-allowed;}
  .status-msg{font-size:.88rem; color:var(--ok); font-weight:600; display:none;}
  .status-msg.show{display:inline;}
  .finish{text-align:center; padding:40px 20px;}
  .finish .big{font-size:2.4rem;}
  .finish h2{margin:10px 0;}
  .finish p{color:var(--sub); max-width:560px; margin:6px auto;}
  .note{font-size:.78rem; color:var(--sub); margin-top:14px;}
</style>
</head>
<body>
<header>
  <span class="chapter-chip">MISSION</span>
  <div>
    <h1>마크다운 미션 실습 — 기초 · 중급 · 고급</h1>
    <div class="sub">같은 문법을 미션마다 다시 만나며 완전히 익힙니다 (🆕 새 기능 · 🔁 반복 훈련)</div>
  </div>
  <div class="progress-wrap">
    <span id="progressText">0 / 0</span>
    <div class="bar"><i id="progressBar"></i></div>
  </div>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<script>
/* ===== LOGIC:BEGIN ===== */

function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inlineMD(s){
  s = s.replace(/`([^`\n]+)`/g, function(_,c){ return '<code>'+c+'</code>'; });
  s = s.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/==([^=\n]+)==/g, '<mark>$1</mark>');
  s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  return s;
}
var LIST_RE = /^(\s*)([-*]|\d+\.)\s+(.*)$/;

function renderMD(src){
  var lines = escapeHtml(src.replace(/\r\n/g,'\n').replace(/\t/g,'  ')).split('\n');
  var html = [], i = 0;
  var HR_RE = /^\s*-{3,}\s*$/;
  function isTableSep(l){ return /^\s*\|?[\s:|-]*-{3,}[\s:|-]*\|?\s*$/.test(l) && l.indexOf('|') !== -1; }
  function listItemHtml(body){
    var cb = body.match(/^\[( |x|X)\]\s*(.*)$/);
    if(cb){ return {html:'<input type="checkbox" disabled'+(cb[1].toLowerCase()==='x'?' checked':'')+'> '+inlineMD(cb[2]), task:true}; }
    return {html:inlineMD(body), task:false};
  }
  while(i < lines.length){
    var line = lines[i];
    if(/^\s*$/.test(line)){ i++; continue; }
    var fence = line.match(/^```\s*(\S+)?\s*$/);
    if(fence){
      var lang = fence[1] || ''; var code = []; i++;
      while(i < lines.length && !/^```/.test(lines[i])){ code.push(lines[i]); i++; }
      i++;
      html.push('<pre>'+(lang?'<span class="lang">'+lang+'</span>':'')+'<code>'+code.join('\n')+'</code></pre>');
      continue;
    }
    var h = line.match(/^(#{1,6})\s+(.*)$/);
    if(h){ var n=h[1].length; html.push('<h'+n+'>'+inlineMD(h[2])+'</h'+n+'>'); i++; continue; }
    if(HR_RE.test(line)){ html.push('<hr>'); i++; continue; }
    if(/^&gt;\s?/.test(line)){
      var q=[];
      while(i < lines.length && /^&gt;\s?/.test(lines[i])){ q.push(lines[i].replace(/^&gt;\s?/,'')); i++; }
      html.push('<blockquote>'+ q.map(function(x){return '<p>'+inlineMD(x)+'</p>';}).join('') +'</blockquote>');
      continue;
    }
    if(line.indexOf('|') !== -1 && i+1 < lines.length && isTableSep(lines[i+1])){
      var cellsOf = function(l){ return l.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(function(c){return c.trim();}); };
      var head = cellsOf(line); i += 2; var rows = [];
      while(i < lines.length && lines[i].indexOf('|') !== -1 && !/^\s*$/.test(lines[i])){ rows.push(cellsOf(lines[i])); i++; }
      html.push('<table><thead><tr>'+head.map(function(c){return '<th>'+inlineMD(c)+'</th>';}).join('')+'</tr></thead><tbody>'
        + rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+inlineMD(c)+'</td>';}).join('')+'</tr>';}).join('') + '</tbody></table>');
      continue;
    }
    if(LIST_RE.test(line)){
      var items=[];
      while(i < lines.length && LIST_RE.test(lines[i])){
        var m = lines[i].match(LIST_RE);
        items.push({ level: m[1].length >= 2 ? 1 : 0, ordered: /^\d+\.$/.test(m[2]), body: m[3] });
        i++;
      }
      var out='', openSub=null, topType = items[0].ordered ? 'ol' : 'ul', liOpen=false;
      out += '<'+topType+'>';
      items.forEach(function(it){
        var li = listItemHtml(it.body);
        if(it.level === 0){
          if(openSub){ out += '</'+openSub+'>'; openSub=null; }
          if(liOpen){ out += '</li>'; }
          out += '<li'+(li.task?' class="task-item"':'')+'>'+li.html; liOpen = true;
        } else {
          if(!openSub){ openSub = it.ordered ? 'ol' : 'ul'; out += '<'+openSub+'>'; }
          out += '<li'+(li.task?' class="task-item"':'')+'>'+li.html+'</li>';
        }
      });
      if(openSub){ out += '</'+openSub+'>'; }
      if(liOpen){ out += '</li>'; }
      out += '</'+topType+'>';
      html.push(out);
      continue;
    }
    var p=[line]; i++;
    while(i < lines.length && !/^\s*$/.test(lines[i]) &&
          !/^(#{1,6}\s|&gt;|```)/.test(lines[i]) && !LIST_RE.test(lines[i]) && !HR_RE.test(lines[i]) &&
          !(lines[i].indexOf('|')!==-1 && i+1<lines.length && isTableSep(lines[i+1]))){
      p.push(lines[i]); i++;
    }
    if(i < lines.length && HR_RE.test(lines[i])){
      html.push('<h2>'+p.map(inlineMD).join('<br>')+'</h2>'); i++; continue;
    }
    html.push('<p>'+p.map(inlineMD).join('<br>')+'</p>');
  }
  return html.join('\n');
}

function countMatch(src, re){ var m = src.match(re); return m ? m.length : 0; }
function hasRealHr(src){
  var ls = src.replace(/\r\n/g,'\n').split('\n');
  for(var i=0;i<ls.length;i++){
    if(/^\s*-{3,}\s*$/.test(ls[i]) && (i===0 || /^\s*$/.test(ls[i-1]))) return true;
  }
  return false;
}
function noSetextAccident(src){
  var ls = src.replace(/\r\n/g,'\n').split('\n');
  for(var i=1;i<ls.length;i++){
    if(/^\s*-{3,}\s*$/.test(ls[i]) && !/^\s*$/.test(ls[i-1])) return false;
  }
  return true;
}
function allTasksValid(s){
  var ls = s.split('\n');
  for(var k=0;k<ls.length;k++){
    var t = ls[k];
    if(/^\s*-\s*\[/.test(t) && !/^\s*- \[( |x|X)\] .+/.test(t)) return false;
  }
  return true;
}

/* ---------- 미션 데이터 ---------- */
var LESSONS = [
{
  type:'info', chip:'START', level:'브리핑', time:'5분', title:'미션 브리핑',
  intro:'<p>앞으로 <strong>3개의 미션</strong>을 수행합니다. 한 번 배운 문법은 다음 미션에서 <strong>반드시 다시 등장</strong>합니다. 반복해서 손에 익히는 것이 이 실습의 목표입니다.</p>'
  + '<table><tr><th>미션</th><th>이름</th><th>내용</th></tr>'
  + '<tr><td><strong>미션 1</strong></td><td>기초 — 문법 장착</td><td>제목·강조·리스트·인용·수평선을 하나씩 익히고 알림장 완성</td></tr>'
  + '<tr><td><strong>미션 2</strong></td><td>중급 — 조합 훈련</td><td>코드·하위 리스트를 새로 배우고, 기초 문법과 조합해 노트 2종 작성</td></tr>'
  + '<tr><td><strong>미션 3</strong></td><td>고급 — 실전 투입</td><td>고장난 문서 수리, 긴 평문 변환, 나만의 노트 자유 설계</td></tr></table>'
  + '<div class="tip"><span class="tiptitle">진행 방법</span><br>각 단계의 <strong>통과 조건</strong>을 모두 만족해야 다음 단계 버튼이 열립니다. 조건 앞의 <strong>🆕는 새로 배우는 기능</strong>, <strong>🔁는 앞에서 배운 것을 다시 쓰는 반복 훈련</strong>입니다. 막히면 힌트 버튼을 누르세요. 단, 힌트를 보기 전에 1분은 스스로 시도해 보세요.</div>',
  task:'준비되었으면 <strong>[미션 1 시작 →]</strong> 버튼을 누르세요.'
},
{
  chip:'M1-1', level:'미션 1 · 기초 — 문법 장착', time:'5분', title:'알림장 뼈대 세우기',
  intro:'<p>모든 문서는 제목부터 시작합니다. <code>#</code>을 쓰고 <strong>한 칸 띄운 뒤</strong> 제목을 씁니다. <code>#</code> 개수가 늘수록 작은 제목입니다. 중요한 글자는 <code>**굵게**</code> 감쌉니다.</p><pre># 큰 제목\n## 중간 제목\n**굵게 할 글자**</pre>',
  task:'첫 줄은 <strong>제목 1(#)</strong>, "내일 준비물"은 <strong>제목 2(##)</strong>로 만들고, <strong>"다음 주 월요일 현장체험학습"을 굵게</strong> 강조하세요.',
  starter:'9월 1일 알림장\n\n내일 준비물\n\n오늘의 중요한 소식은 다음 주 월요일 현장체험학습입니다.',
  checks:[
    {label:'🆕 제목 1(#)이 있다', test:function(s){ return /^# .+/m.test(s); }},
    {label:'🆕 제목 2(##)가 있다', test:function(s){ return /^## .+/m.test(s); }},
    {label:'🆕 **굵게** 강조가 있다', test:function(s){ return /\*\*[^*\n]+\*\*/.test(s); }},
    {label:'🆕 # 뒤 띄어쓰기를 빠뜨린 곳이 없다', test:function(s){ return !/^#{1,6}[^#\s]/m.test(s); }}
  ],
  hint:'# 과 글자 사이에 공백 한 칸, 별표는 여닫이 두 쌍입니다.',
  hintCode:'# 9월 1일 알림장\n\n## 내일 준비물\n\n오늘의 중요한 소식은 **다음 주 월요일 현장체험학습**입니다.'
},
{
  chip:'M1-2', level:'미션 1 · 기초 — 문법 장착', time:'7분', title:'리스트 3종 세트',
  intro:'<p>리스트는 세 종류입니다. 나열은 <code>-</code>, 순서는 <code>1.</code>, 할 일은 <code>- [ ]</code>. 태스크 리스트는 <strong>대시와 대괄호 사이, 대괄호 안의 공란</strong>을 꼭 지켜야 합니다.</p><pre>- 나열할 것\n1. 순서 있는 것\n- [ ] 할 일\n- [x] 끝낸 일</pre>',
  task:'문장 속 <strong>준비물 3가지는 - 리스트</strong>로, <strong>아침 활동 3단계는 숫자 리스트</strong>로, <strong>오늘 할 일 2가지는 태스크 리스트</strong>로 정리하세요. 제목 구조는 그대로 유지합니다.',
  starter:'# 9월 1일 알림장\n\n## 내일 준비물\n\n필통, 물통, 우산을 챙깁니다.\n\n## 아침 활동 순서\n\n등교하면 가방 정리를 하고 독서를 한 뒤 아침 인사를 나눕니다.\n\n## 오늘 할 일\n\n수학 익힘책 풀기와 일기 쓰기를 끝내야 합니다.',
  checks:[
    {label:'🆕 - 리스트가 3개 이상 있다', test:function(s){ return countMatch(s,/^- (?!\[)/gm) >= 3; }},
    {label:'🆕 숫자 리스트가 3개 이상 있다', test:function(s){ return countMatch(s,/^\d+\. .+/gm) >= 3; }},
    {label:'🆕 태스크 리스트(- [ ])가 2개 이상 있다', test:function(s){ return countMatch(s,/^- \[[ xX]\] .+/gm) >= 2; }},

/* ---------- 앱 상태 및 UI ---------- */
var state = {
  current:0,
  done:LESSONS.map(function(){return false;}),
  answers:LESSONS.map(function(l){return l.starter || '';})
};
var nav = document.getElementById('nav');
var main = document.getElementById('main');

function renderNav(){
  var html = '', lastLv = '';
  LESSONS.forEach(function(l, idx){
    if(l.level !== lastLv){ html += '<div class="lv">'+l.level+'</div>'; lastLv = l.level; }
    html += '<button data-i="'+idx+'" class="'+(idx===state.current?'active':'')+'">'
          + '<span>'+l.chip+' · '+l.title+'</span>' + (state.done[idx] ? '<span class="done">✓</span>' : '') + '</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){ go(parseInt(b.dataset.i,10)); });
  });
  var doneCount = state.done.filter(Boolean).length;
  document.getElementById('progressText').textContent = doneCount + ' / ' + LESSONS.length;
  document.getElementById('progressBar').style.width = (doneCount / LESSONS.length * 100) + '%';
}

function go(i){
  state.current = i;
  if(i >= LESSONS.length){ renderFinish(); } else { renderLesson(); }
  renderNav();
  window.scrollTo(0,0);
}

function headHtml(l){
  return '<div class="lesson-head"><span class="booknum">'+l.chip+'</span><h2>'+l.title+'</h2></div>'
       + '<div class="intro">'+l.intro+'</div>'
       + '<div class="task">📝 <strong>미션</strong><br>'+l.task+'</div>';
}
function footerHtml(idx, labelOverride){
  var last = idx+1 >= LESSONS.length;
  return '<div class="footer-nav">'
    + (idx > 0 ? '<button class="btn" id="prevBtn">← 이전</button>' : '')
    + '<button class="btn primary" id="nextBtn" disabled>'+(labelOverride || (last ? '실습 마치기 🎓' : '다음 단계 →'))+'</button>'
    + '<span class="status-msg" id="statusMsg">🎉 통과! 다음으로 넘어가세요.</span>'
    + '</div>';
}
function bindFooter(idx){
  if(idx > 0){ document.getElementById('prevBtn').addEventListener('click', function(){ go(idx-1); }); }
  document.getElementById('nextBtn').addEventListener('click', function(){ go(idx+1); });
}

function renderLesson(){
  var idx = state.current;
  var l = LESSONS[idx];

  if(l.type === 'info'){
    main.innerHTML = '<div class="card">'+headHtml(l) + footerHtml(idx, '미션 1 시작 →') + '</div>';
    bindFooter(idx);
    applyPass(idx, true);
    return;
  }

  main.innerHTML =
    '<div class="card">'+headHtml(l)+'</div>'
    + '<div class="work">'
    + '<div class="pane"><div class="pane-title">✏️ 여기에 마크다운을 작성하세요 <button class="hintbtn" id="hintBtn">힌트 보기</button></div><textarea id="editor" spellcheck="false"></textarea></div>'
    + '<div class="pane"><div class="pane-title">👀 실시간 미리보기</div><div class="preview" id="preview"></div></div>'
    + '</div>'
    + '<div class="hint" id="hintBox">💡 ' + l.hint + (l.hintCode ? '<pre>'+escapeHtml(l.hintCode)+'</pre>' : '') + '</div>'
    + '<div class="checks card"><h3>통과 조건</h3><div id="checkList"></div>'
    + footerHtml(idx) + '</div>';

  var editor = document.getElementById('editor');
  editor.value = state.answers[idx];
  document.getElementById('hintBtn').addEventListener('click', function(){
    document.getElementById('hintBox').classList.toggle('show');
  });
  bindFooter(idx);
  editor.addEventListener('input', function(){
    state.answers[idx] = editor.value;
    update(idx);
  });
  update(idx);
}

function update(idx){
  var l = LESSONS[idx];
  var src = state.answers[idx];
  document.getElementById('preview').innerHTML = renderMD(src);
  var allPass = true;
  document.getElementById('checkList').innerHTML = l.checks.map(function(c){
    var pass = false;
    try{ pass = !!c.test(src); }catch(e){ pass = false; }
    if(!pass) allPass = false;
    return '<div class="check '+(pass?'pass':'')+'"><span class="mark">'+(pass?'✓':'○')+'</span><span>'+c.label+'</span></div>';
  }).join('');
  applyPass(idx, allPass);
}
function applyPass(idx, allPass){
  document.getElementById('nextBtn').disabled = !allPass;
  document.getElementById('statusMsg').classList.toggle('show', allPass);
  if(allPass && !state.done[idx]){ state.done[idx] = true; renderNav(); }
}

function renderFinish(){
  main.innerHTML =
    '<div class="card finish">'
    + '<div class="big">🏆</div>'
    + '<h2>3개 미션 완주!</h2>'
    + '<p>기초에서 장착한 문법을 중급에서 조합하고 고급에서 실전에 투입했습니다. 같은 문법을 여러 번 반복했으니 이제 손이 기억할 것입니다.</p>'
    + '<p>마지막으로 만든 <strong>학급 운영 홈 노트</strong>를 실제 옵시디언에 붙여 넣어, 오늘부터 진짜 노트로 사용해 보세요.</p>'
    + '<p style="margin-top:16px"><button class="btn primary" onclick="location.reload()">처음부터 다시 하기</button></p>'
    + '<p class="note">※ 이 페이지는 저장 기능이 없습니다. 새로고침하면 작성 내용이 사라지니, 남기고 싶은 답안은 옵시디언 노트로 복사해 두세요.</p>'
    + '</div>';
}

renderNav();
renderLesson();
</script>
