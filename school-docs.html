<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학교 문서로 배우는 마크다운 실습</title>
<style>
  :root{
    --bg:#f6f7fb; --card:#ffffff; --ink:#1f2430; --sub:#5b6472;
    --line:#e5e8ef; --accent:#4f5dd6; --accent-soft:#eef0fc;
    --ok:#1a9e6c; --ok-soft:#e6f6ef; --warn:#c2410c;
    --code-bg:#f1f3f8; --radius:14px;
    font-size:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.65;
  }
  header{
    background:var(--card); border-bottom:1px solid var(--line);
    padding:14px 24px; display:flex; align-items:center; gap:16px;
    position:sticky; top:0; z-index:20;
  }
  header h1{font-size:1.05rem; font-weight:700;}
  header .sub{font-size:.8rem; color:var(--sub);}
  .progress-wrap{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:.85rem; color:var(--sub);}
  .bar{width:160px; height:8px; background:var(--line); border-radius:99px; overflow:hidden;}
  .bar i{display:block; height:100%; width:0%; background:var(--accent); border-radius:99px; transition:width .3s;}
  .layout{display:flex; max-width:1400px; margin:0 auto; min-height:calc(100vh - 61px);}
  nav{
    width:250px; flex-shrink:0; padding:20px 12px; border-right:1px solid var(--line);
    background:var(--card);
  }
  nav .lv{font-size:.72rem; font-weight:700; color:var(--sub); letter-spacing:.08em; margin:16px 8px 6px;}
  nav button{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    padding:9px 10px; border:none; background:none; border-radius:10px;
    font-size:.88rem; color:var(--ink); cursor:pointer; font-family:inherit;
  }
  nav button:hover{background:var(--accent-soft);}
  nav button.active{background:var(--accent); color:#fff; font-weight:600;}
  nav button .done{margin-left:auto; color:var(--ok); font-weight:700;}
  nav button.active .done{color:#d9f5e8;}
  main{flex:1; padding:24px; min-width:0;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; margin-bottom:16px;}
  .lesson-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .badge{font-size:.7rem; font-weight:700; padding:3px 10px; border-radius:99px; background:var(--accent-soft); color:var(--accent);}
  .lesson-head h2{font-size:1.25rem;}
  .intro{margin-top:10px; color:var(--ink); font-size:.95rem;}
  .intro p{margin:8px 0;}
  .intro code, .task code{background:var(--code-bg); padding:2px 6px; border-radius:6px; font-size:.85em; font-family:Consolas,Menlo,monospace;}
  .intro pre{background:var(--code-bg); border-radius:10px; padding:12px 14px; margin:10px 0; overflow-x:auto; font-size:.85rem; font-family:Consolas,Menlo,monospace; line-height:1.55;}
  .task{background:var(--accent-soft); border-radius:10px; padding:14px 16px; margin-top:14px; font-size:.93rem;}
  .task strong{color:var(--accent);}
  .work{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:900px){ .work{grid-template-columns:1fr;} .layout{flex-direction:column;} nav{width:100%; display:flex; flex-wrap:wrap; border-right:none; border-bottom:1px solid var(--line);} nav .lv{width:100%;} nav button{width:auto;} }
  .pane{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column;}
  .pane-title{font-size:.78rem; font-weight:700; color:var(--sub); padding:10px 14px; border-bottom:1px solid var(--line); background:#fafbfe; display:flex; align-items:center;}
  .pane-title .hintbtn{margin-left:auto; font-size:.75rem; border:1px solid var(--line); background:#fff; border-radius:8px; padding:3px 10px; cursor:pointer; color:var(--sub); font-family:inherit;}
  textarea{
    width:100%; flex:1; min-height:300px; border:none; resize:vertical; padding:14px;
    font-family:Consolas,Menlo,'Malgun Gothic',monospace; font-size:.9rem; line-height:1.7;
    outline:none; color:var(--ink); background:#fff;
  }
  .preview{padding:14px 16px; min-height:300px; font-size:.92rem; overflow-x:auto;}
  .preview h1{font-size:1.5rem; margin:.5em 0 .35em; border-bottom:2px solid var(--line); padding-bottom:.2em;}
  .preview h2{font-size:1.25rem; margin:.6em 0 .3em;}
  .preview h3{font-size:1.05rem; margin:.6em 0 .3em;}
  .preview p{margin:.45em 0;}
  .preview ul,.preview ol{margin:.45em 0 .45em 1.4em;}
  .preview li{margin:.15em 0;}
  .preview li.task-item{list-style:none; margin-left:-1.2em;}
  .preview blockquote{border-left:4px solid var(--accent); background:var(--accent-soft); padding:8px 14px; border-radius:0 8px 8px 0; margin:.6em 0; color:#3b4664;}
  .preview hr{border:none; border-top:2px solid var(--line); margin:1em 0;}
  .preview table{border-collapse:collapse; margin:.6em 0; width:auto;}
  .preview th,.preview td{border:1px solid #cfd6e4; padding:6px 12px; font-size:.88rem;}
  .preview th{background:var(--accent-soft);}
  .preview code{background:var(--code-bg); padding:2px 6px; border-radius:6px; font-size:.85em; font-family:Consolas,Menlo,monospace;}
  .preview pre{background:var(--code-bg); border-radius:10px; padding:12px 14px; margin:.6em 0; overflow-x:auto;}
  .preview pre code{background:none; padding:0;}
  .preview a{color:var(--accent);}
  .preview del{color:var(--sub);}
  .preview details{border:1px solid var(--line); border-radius:10px; padding:8px 14px; margin:.6em 0;}
  .preview summary{cursor:pointer; font-weight:600; color:var(--accent);}
  .checks{margin-top:16px;}
  .checks h3{font-size:.9rem; margin-bottom:8px;}
  .check{display:flex; gap:10px; align-items:flex-start; padding:7px 12px; border-radius:10px; font-size:.9rem; color:var(--sub); margin-bottom:4px; background:#fafbfe; border:1px solid var(--line);}
  .check.pass{background:var(--ok-soft); color:var(--ok); border-color:#bfe8d6; font-weight:600;}
  .check .mark{font-weight:700; width:1.2em; flex-shrink:0;}
  .hint{display:none; margin-top:12px; background:#fff8ed; border:1px solid #f3dfc0; border-radius:10px; padding:12px 16px; font-size:.88rem; color:#7c5a1e;}
  .hint.show{display:block;}
  .hint pre{background:#fff; border-radius:8px; padding:10px 12px; margin-top:8px; font-family:Consolas,Menlo,monospace; font-size:.83rem; overflow-x:auto; color:#444;}
  .footer-nav{display:flex; gap:12px; margin-top:18px; align-items:center;}
  .btn{
    font-family:inherit; font-size:.92rem; font-weight:600; border-radius:10px; cursor:pointer;
    padding:10px 20px; border:1px solid var(--line); background:var(--card); color:var(--ink);
  }
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:disabled{background:#b9bfe0; border-color:#b9bfe0; cursor:not-allowed;}
  .status-msg{font-size:.88rem; color:var(--ok); font-weight:600; display:none;}
  .status-msg.show{display:inline;}
    .submit-btn{font-family:inherit; font-size:.85rem; font-weight:700; border-radius:10px; cursor:pointer; padding:9px 18px; border:none; background:var(--ok); color:#fff; flex-shrink:0;}
  .submit-btn:disabled{background:#c9cdd6; cursor:not-allowed;}
  .modal-bg{display:none; position:fixed; inset:0; background:rgba(42,36,56,.45); z-index:50; align-items:center; justify-content:center; padding:20px;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff; border-radius:16px; padding:26px 28px; max-width:420px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal h3{font-size:1.1rem; margin-bottom:6px;}
  .modal p{font-size:.88rem; color:var(--sub); margin-bottom:14px;}
  .modal input{width:100%; padding:11px 14px; border:1.5px solid var(--line); border-radius:10px; font-size:.95rem; font-family:inherit; outline:none; margin-bottom:14px;}
  .modal input:focus{border-color:var(--accent);}
  .modal .row{display:flex; gap:10px; justify-content:flex-end;}
  .modal .sent{display:none; background:var(--ok-soft); color:var(--ok); border-radius:10px; padding:10px 14px; font-size:.86rem; font-weight:600; margin-bottom:14px;}
  .modal .sent.show{display:block;}
  .finish{text-align:center; padding:40px 20px;}
  .finish .big{font-size:2.4rem;}
  .finish h2{margin:10px 0;}
  .finish p{color:var(--sub); max-width:520px; margin:6px auto;}
  .note{font-size:.78rem; color:var(--sub); margin-top:14px;}
</style>
</head>
<body>
<header>
  <div>
    <h1>학교 문서로 배우는 마크다운 실습</h1>
    <div class="sub">알림장·가정통신문·평가 안내를 마크다운으로 — 조건을 모두 통과하면 다음 단계가 열립니다</div>
  </div>
  <div class="progress-wrap">
    <span id="progressText">0 / 0</span>
    <div class="bar"><i id="progressBar"></i></div>
  </div>
  <button class="submit-btn" id="submitBtn" disabled title="모든 단계를 완료하면 활성화됩니다">✉️ 수강완료 제출</button>
</header>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>🎓 수강완료 제출</h3>
    <p>모든 단계를 완료했습니다! 이름을 입력하고 제출 버튼을 누르면 <strong>수강완료 명단에 바로 등록</strong>됩니다.</p>
    <div class="sent" id="sentMsg">✓ 제출 완료! 수강완료 명단에 이름이 올라갔습니다.</div>
    <input type="text" id="studentName" placeholder="이름을 입력하세요 (예: 홍길동)" maxlength="30">
    <div class="row">
      <button class="btn" id="modalCancel">닫기</button>
      <button class="btn primary" id="modalSend">제출하기</button>
    </div>
  </div>
</div>

<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<script>
/* ===== LOGIC:BEGIN ===== */

/* ---------- 간이 마크다운 렌더러 (수업에서 다루는 문법 지원) ---------- */
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function inlineMD(s){
  s = s.replace(/`([^`\n]+)`/g, function(_,c){ return '<code>'+c+'</code>'; });
  s = s.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  return s;
}
function renderMD(src){
  var lines = escapeHtml(src.replace(/\r\n/g,'\n')).split('\n');
  // details/summary/br 허용
  lines = lines.map(function(l){
    return l.replace(/&lt;(\/?)(details|summary|br)&gt;/g, '<$1$2>');
  });
  var html = [], i = 0;

  function isTableSep(l){ return /^\s*\|?[\s:|-]*-{3,}[\s:|-]*\|?\s*$/.test(l) && l.indexOf('-') !== -1; }

  while(i < lines.length){
    var line = lines[i];

    // 빈 줄
    if(/^\s*$/.test(line)){ i++; continue; }

    // 코드블록
    if(/^```/.test(line)){
      var code = []; i++;
      while(i < lines.length && !/^```/.test(lines[i])){ code.push(lines[i]); i++; }
      i++;
      html.push('<pre><code>'+code.join('\n')+'</code></pre>');
      continue;
    }
    // 제목
    var h = line.match(/^(#{1,6})\s+(.*)$/);
    if(h){ var n=h[1].length; html.push('<h'+n+'>'+inlineMD(h[2])+'</h'+n+'>'); i++; continue; }
    // 구분선
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)){ html.push('<hr>'); i++; continue; }
    // 인용 (이스케이프 이후이므로 &gt; 로 판별)
    if(/^&gt;\s?/.test(line)){
      var q=[];
      while(i < lines.length && /^&gt;\s?/.test(lines[i])){ q.push(lines[i].replace(/^&gt;\s?/,'')); i++; }
      html.push('<blockquote>'+ q.map(function(x){return '<p>'+inlineMD(x)+'</p>';}).join('') +'</blockquote>');
      continue;
    }
    // 표
    if(line.indexOf('|') !== -1 && i+1 < lines.length && isTableSep(lines[i+1])){
      var cellsOf = function(l){ return l.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(function(c){return c.trim();}); };
      var head = cellsOf(line);
      i += 2;
      var rows = [];
      while(i < lines.length && lines[i].indexOf('|') !== -1 && !/^\s*$/.test(lines[i])){
        rows.push(cellsOf(lines[i])); i++;
      }
      var t = '<table><thead><tr>' + head.map(function(c){return '<th>'+inlineMD(c)+'</th>';}).join('') + '</tr></thead><tbody>';
      t += rows.map(function(r){ return '<tr>'+ r.map(function(c){return '<td>'+inlineMD(c)+'</td>';}).join('') +'</tr>'; }).join('');
      t += '</tbody></table>';
      html.push(t);
      continue;
    }
    // 순서 없는 목록 (체크박스 포함)
    if(/^\s*[-*]\s+/.test(line)){
      var items=[];
      while(i < lines.length && /^\s*[-*]\s+/.test(lines[i])){
        var body = lines[i].replace(/^\s*[-*]\s+/,'');
        var cb = body.match(/^\[( |x|X)\]\s*(.*)$/);
        if(cb){
          items.push('<li class="task-item"><input type="checkbox" disabled'+(cb[1].toLowerCase()==='x'?' checked':'')+'> '+inlineMD(cb[2])+'</li>');
        } else {
          items.push('<li>'+inlineMD(body)+'</li>');
        }
        i++;
      }
      html.push('<ul>'+items.join('')+'</ul>');
      continue;
    }
    // 순서 있는 목록
    if(/^\s*\d+\.\s+/.test(line)){
      var oitems=[];
      while(i < lines.length && /^\s*\d+\.\s+/.test(lines[i])){
        oitems.push('<li>'+inlineMD(lines[i].replace(/^\s*\d+\.\s+/,''))+'</li>'); i++;
      }
      html.push('<ol>'+oitems.join('')+'</ol>');
      continue;
    }
    // details 블록 통과
    if(/^<\/?(details|summary)/.test(line.trim())){
      html.push(inlineMD(line)); i++; continue;
    }
    // 문단
    var p=[line];
    i++;
    while(i < lines.length && !/^\s*$/.test(lines[i]) &&
          !/^(#{1,6}\s|&gt;|\s*[-*]\s|\s*\d+\.\s|```|<\/?(details|summary))/.test(lines[i]) &&
          !(lines[i].indexOf('|')!==-1 && i+1<lines.length && isTableSep(lines[i+1])) &&
          !/^\s*(-{3,}|\*{3,})\s*$/.test(lines[i])){
      p.push(lines[i]); i++;
    }
    html.push('<p>'+p.map(inlineMD).join('<br>')+'</p>');
  }
  return html.join('\n');
}

/* ---------- 채점 유틸 ---------- */
function countMatch(src, re){
  var m = src.match(re); return m ? m.length : 0;
}

/* ---------- 레슨 데이터 ---------- */
var LESSONS = [
{
  level:'기초', title:'1. 제목 만들기',
  intro:'<p>문서의 뼈대는 제목입니다. 마크다운에서는 <code>#</code> 기호로 제목을 만듭니다. <code>#</code> 개수가 많을수록 작은 제목이 됩니다.</p><pre># 가장 큰 제목 (문서 제목)\n## 중간 제목 (장)\n### 작은 제목 (절)</pre><p>⚠️ <code>#</code> 뒤에 <strong>공백 한 칸</strong>이 꼭 있어야 합니다. <code>#제목</code>은 제목이 되지 않습니다.</p>',
  task:'아래 여름방학 안내 문서에서 <strong>첫 줄은 큰 제목(#)</strong>으로, <strong>"방학 중 꼭 지켜요"와 "개학일 안내"는 중간 제목(##)</strong>으로 만들어 보세요.',
  starter:'여름방학 안내\n\n방학 중 꼭 지켜요\n\n규칙적인 생활을 하고, 물놀이 안전 수칙을 지킵니다.\n\n개학일 안내\n\n개학일은 8월 25일 화요일입니다.',
  checks:[
    {label:'# 으로 만든 큰 제목이 1개 있다', test:function(s){ return /^# .+/m.test(s); }},
    {label:'## 으로 만든 중간 제목이 2개 있다', test:function(s){ return countMatch(s,/^## .+/gm) >= 2; }},
    {label:'# 뒤에 공백을 빠뜨린 곳이 없다', test:function(s){ return !/^#{1,6}[^#\s]/m.test(s); }}
  ],
  hint:'# 은 문서 전체 제목에 한 번, ## 은 각 장의 제목에 씁니다.',
  hintCode:'# 여름방학 안내\n\n## 방학 중 꼭 지켜요\n\n규칙적인 생활을 하고, 물놀이 안전 수칙을 지킵니다.\n\n## 개학일 안내\n\n개학일은 8월 25일 화요일입니다.'
},
{
  level:'기초', title:'2. 강조하기',
  intro:'<p>중요한 내용은 눈에 띄게 만들어야 합니다.</p><pre>**굵게**   → 중요한 정보\n*기울임*   → 살짝 강조\n~~취소선~~ → 취소된 내용</pre><p>여는 기호가 있으면 <strong>닫는 기호</strong>도 있어야 합니다.</p>',
  task:'<strong>"방학 기간"은 굵게</strong>, <strong>"건강한"은 기울임</strong>으로 강조하고, 취소된 행사인 <strong>"물놀이 체험 행사"에는 취소선</strong>을 그어 보세요.',
  starter:'# 여름방학 안내\n\n방학 기간: 7월 28일 ~ 8월 24일\n\n물놀이 체험 행사 (폭염으로 취소되었습니다)\n\n개학일에 건강한 모습으로 만나요.',
  checks:[
    {label:'**굵게** 처리한 부분이 있다', test:function(s){ return /\*\*[^*\n]+\*\*/.test(s); }},
    {label:'*기울임* 처리한 부분이 있다', test:function(s){ return /(^|[^*])\*[^*\n]+\*(?!\*)/m.test(s); }},
    {label:'~~취소선~~ 처리한 부분이 있다', test:function(s){ return /~~[^~\n]+~~/.test(s); }}
  ],
  hint:'별표 2개로 감싸면 굵게, 1개로 감싸면 기울임, 물결 2개로 감싸면 취소선입니다.',
  hintCode:'**방학 기간**: 7월 28일 ~ 8월 24일\n\n~~물놀이 체험 행사~~ (폭염으로 취소되었습니다)\n\n개학일에 *건강한* 모습으로 만나요.'
},
{
  level:'기초', title:'3. 목록 만들기',
  intro:'<p>문장 속에 늘어놓은 항목은 목록으로 정리하면 훨씬 읽기 쉽습니다.</p><pre>- 순서가 없는 목록 (준비물, 유의사항)\n- 하이픈과 공백으로 시작\n\n1. 순서가 있는 목록 (절차, 단계)\n2. 숫자와 점, 공백으로 시작</pre>',
  task:'문장 속에 숨어 있는 <strong>준비물 3가지는 순서 없는 목록(-)</strong>으로, <strong>아침 활동 3단계는 순서 있는 목록(1.)</strong>으로 꺼내어 정리해 보세요.',
  starter:'# 2학기 첫 주 안내\n\n## 준비물\n\n준비물은 실내화, 물통, 색연필입니다.\n\n## 아침 활동 순서\n\n교실에 오면 첫째 독서를 하고, 둘째 일기를 쓰고, 셋째 자리를 정리합니다.',

/* ---------- 앱 상태 및 UI ---------- */
var state = { current:0, done:LESSONS.map(function(){return false;}), answers:LESSONS.map(function(l){return l.starter;}) };

var nav = document.getElementById('nav');
var main = document.getElementById('main');

function renderNav(){
  var html = '', lastLv = '';
  LESSONS.forEach(function(l, idx){
    if(l.level !== lastLv){ html += '<div class="lv">'+l.level+'</div>'; lastLv = l.level; }
    html += '<button data-i="'+idx+'" class="'+(idx===state.current?'active':'')+'">'
          + l.title + (state.done[idx] ? '<span class="done">✓</span>' : '') + '</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){ go(parseInt(b.dataset.i,10)); });
  });
  var doneCount = state.done.filter(Boolean).length;
  document.getElementById('progressText').textContent = doneCount + ' / ' + LESSONS.length;
  document.getElementById('progressBar').style.width = (doneCount / LESSONS.length * 100) + '%';
}

function go(i){
  state.current = i;
  renderLesson();
  renderNav();
  window.scrollTo(0,0);
}

function renderLesson(){
  var idx = state.current;
  if(idx >= LESSONS.length){ renderFinish(); return; }
  var l = LESSONS[idx];
  main.innerHTML =
    '<div class="card">'
    + '<div class="lesson-head"><span class="badge">'+l.level+'</span><h2>'+l.title+'</h2></div>'
    + '<div class="intro">'+l.intro+'</div>'
    + '<div class="task">📝 <strong>실습 과제</strong><br>'+l.task+'</div>'
    + '</div>'
    + '<div class="work">'
    + '<div class="pane"><div class="pane-title">✏️ 여기에 마크다운을 작성하세요 <button class="hintbtn" id="hintBtn">힌트 보기</button></div><textarea id="editor" spellcheck="false"></textarea></div>'
    + '<div class="pane"><div class="pane-title">👀 실시간 미리보기</div><div class="preview" id="preview"></div></div>'
    + '</div>'
    + '<div class="hint" id="hintBox">💡 ' + l.hint + (l.hintCode ? '<pre>'+escapeHtml(l.hintCode)+'</pre>' : '') + '</div>'
    + '<div class="checks card"><h3>통과 조건</h3><div id="checkList"></div>'
    + '<div class="footer-nav">'
    + (idx > 0 ? '<button class="btn" id="prevBtn">← 이전</button>' : '')
    + '<button class="btn primary" id="nextBtn" disabled>다음 레슨 →</button>'
    + '<span class="status-msg" id="statusMsg">🎉 모든 조건 통과! 다음으로 넘어가세요.</span>'
    + '</div></div>';

  var editor = document.getElementById('editor');
  editor.value = state.answers[idx];

  document.getElementById('hintBtn').addEventListener('click', function(){
    document.getElementById('hintBox').classList.toggle('show');
  });
  if(idx > 0){
    document.getElementById('prevBtn').addEventListener('click', function(){ go(idx-1); });
  }
  document.getElementById('nextBtn').addEventListener('click', function(){
    if(idx+1 < LESSONS.length){ go(idx+1); } else { state.current = LESSONS.length; renderFinish(); renderNav(); }
  });
  editor.addEventListener('input', function(){
    state.answers[idx] = editor.value;
    update(idx);
  });
  update(idx);
}

function update(idx){
  var l = LESSONS[idx];
  var src = state.answers[idx];
  document.getElementById('preview').innerHTML = renderMD(src);
  var allPass = true;
  var html = l.checks.map(function(c){
    var pass = false;
    try{ pass = !!c.test(src); }catch(e){ pass = false; }
    if(!pass) allPass = false;
    return '<div class="check '+(pass?'pass':'')+'"><span class="mark">'+(pass?'✓':'○')+'</span><span>'+c.label+'</span></div>';
  }).join('');
  document.getElementById('checkList').innerHTML = html;
  var next = document.getElementById('nextBtn');
  var msg = document.getElementById('statusMsg');
  next.disabled = !allPass;
  msg.classList.toggle('show', allPass);
  if(allPass && !state.done[idx]){ state.done[idx] = true; renderNav(); }
  if(!allPass && state.done[idx]){ /* 유지: 한 번 통과하면 완료 표시 유지 */ }
}

function renderFinish(){
  main.innerHTML =
    '<div class="card finish">'
    + '<div class="big">🎓</div>'
    + '<h2>수고하셨습니다!</h2>'
    + '<p>알림장부터 가정통신문까지, 학교 문서를 마크다운으로 구조화하는 10단계를 모두 마쳤습니다.</p>'
    + '<p>이제 같은 마크다운으로 AI에게 구조화된 요청을 보내고, Notion·Obsidian에 기록하고, Gamma로 슬라이드를 만들 수 있습니다.</p>'
    + '<p style="margin-top:16px"><button class="btn primary" onclick="openSubmitModal()" style="background:var(--ok); border-color:var(--ok);">✉️ 수강완료 제출하기</button> '
    + '<button class="btn" onclick="location.reload()">처음부터 다시 하기</button></p>'

/* ---------- 수강완료 제출 ---------- */
var SUBMIT_URL = 'https://script.google.com/macros/s/AKfycbx1igAOA8cgw5PCdHY_zZV92WasQ9nu3U5TOzTqe7JlF4r62u8gPHTr9f5_gwwhyfji/exec';
var COURSE = '학교 문서 실습';
function allMissionsDone(){
  return LESSONS.every(function(l, i){ return l.type === 'info' || state.done[i]; });
}
function openSubmitModal(){
  if(!allMissionsDone()) return;
  document.getElementById('sentMsg').classList.remove('show');
  document.getElementById('modalBg').classList.add('show');
  document.getElementById('studentName').focus();
}
function closeSubmitModal(){ document.getElementById('modalBg').classList.remove('show'); }
var submitting = false;
function sendCompletion(){
  if(submitting) return;
  var name = document.getElementById('studentName').value.trim();
  if(!name){ document.getElementById('studentName').focus(); return; }
  var btn = document.getElementById('modalSend');
  submitting = true;
  btn.disabled = true;
  btn.textContent = '제출 중...';
  fetch(SUBMIT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ name: name, course: COURSE })
  }).then(function(){
    document.getElementById('sentMsg').classList.add('show');
    btn.textContent = '제출 완료 \u2713';
  }).catch(function(){
    submitting = false;
    btn.disabled = false;
    btn.textContent = '제출하기';
    alert('제출에 실패했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요. 계속 안 되면 선생님께 직접 알려 주세요.');
  });
}
document.getElementById('submitBtn').addEventListener('click', openSubmitModal);
document.getElementById('modalCancel').addEventListener('click', closeSubmitModal);
document.getElementById('modalSend').addEventListener('click', sendCompletion);
document.getElementById('modalBg').addEventListener('click', function(e){ if(e.target === this) closeSubmitModal(); });
document.getElementById('studentName').addEventListener('keydown', function(e){ if(e.key === 'Enter') sendCompletion(); });
var _renderNav0 = renderNav;
renderNav = function(){ _renderNav0(); var b = document.getElementById('submitBtn'); if(b) b.disabled = !allMissionsDone(); };

renderNav();
renderLesson();
</script>
