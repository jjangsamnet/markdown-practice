<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수강완료 대시보드 — 마크다운 실습</title>
<style>
  :root{
    --bg:#f7f5fc; --card:#fff; --ink:#2a2438; --sub:#6d6580;
    --line:#e8e3f4; --accent:#8b5cf6; --accent-deep:#6d3ef0; --accent-soft:#f1ecfd;
    --ok:#1a9e6c; --ok-soft:#e6f6ef;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; padding:32px 20px;}
  .wrap{max-width:760px; margin:0 auto;}
  .head{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:20px;}
  .head .gem{font-size:2rem;}
  .head h1{font-size:1.4rem; font-weight:800;}
  .head p{color:var(--sub); font-size:.85rem; width:100%;}
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:18px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 20px;}
  .stat .num{font-size:1.8rem; font-weight:800; color:var(--accent-deep);}
  .stat .label{font-size:.8rem; color:var(--sub);}
  .toolbar{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .toolbar .status{font-size:.78rem; color:var(--sub);}
  button{font-family:inherit; font-size:.85rem; font-weight:600; border-radius:10px; cursor:pointer; padding:8px 16px; border:1px solid var(--line); background:var(--card); color:var(--ink);}
  button:hover{background:var(--accent-soft);}
  table{width:100%; border-collapse:collapse; background:var(--card); border-radius:14px; overflow:hidden; border:1px solid var(--line);}
  th{background:var(--accent-soft); color:var(--accent-deep); font-size:.8rem; text-align:left; padding:10px 16px;}
  td{padding:10px 16px; border-top:1px solid var(--line); font-size:.92rem;}
  td.no{color:var(--sub); width:52px;}
  td.time{color:var(--sub); font-size:.82rem; white-space:nowrap;}
  .empty{text-align:center; color:var(--sub); padding:40px 20px; background:var(--card); border:1px dashed var(--line); border-radius:14px;}
  .badge-new{display:inline-block; font-size:.68rem; font-weight:700; color:#fff; background:var(--ok); border-radius:99px; padding:1px 8px; margin-left:8px;}
  .err{display:none; background:#fff3f0; border:1px solid #f3c4b8; color:#b03a1e; border-radius:12px; padding:12px 16px; font-size:.88rem; margin-bottom:12px;}
  .err.show{display:block;}
  .foot{font-size:.75rem; color:var(--sub); margin-top:16px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="gem">📋</span>
    <h1>수강완료 대시보드</h1>
    <p>마크다운 미션 실습을 완료하고 제출한 수강생 명단입니다. 30초마다 자동으로 새로고침됩니다.</p>
  </div>

  <div class="stats">
    <div class="stat"><div class="num" id="statTotal">–</div><div class="label">총 제출</div></div>
    <div class="stat"><div class="num" id="statToday">–</div><div class="label">오늘 제출</div></div>
    <div class="stat"><div class="num" id="statLast">–</div><div class="label">마지막 제출</div></div>
  </div>

  <div class="err" id="errBox">명단을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>

  <div class="toolbar">
    <button id="refreshBtn">🔄 새로고침</button>
    <select id="courseFilter" style="font-family:inherit; font-size:.85rem; padding:8px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink);">
      <option value="">전체 실습</option>
    </select>
    <span class="status" id="statusText"></span>
  </div>

  <div id="listArea"><div class="empty">불러오는 중...</div></div>

  <p class="foot">※ 제출 기록은 Google 스프레드시트 「마크다운 실습 수강완료 제출」에 저장됩니다. 잘못 제출된 행은 시트에서 직접 삭제하면 대시보드에도 반영됩니다.</p>
</div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbx1igAOA8cgw5PCdHY_zZV92WasQ9nu3U5TOzTqe7JlF4r62u8gPHTr9f5_gwwhyfji/exec';
var loading = false;
var allRows = [];

function fmt(d){
  var t = new Date(d);
  if(isNaN(t)) return String(d);
  var mm = (t.getMonth()+1), dd = t.getDate();
  var hh = String(t.getHours()).padStart(2,'0'), mi = String(t.getMinutes()).padStart(2,'0');
  return mm + '/' + dd + ' ' + hh + ':' + mi;
}
function isToday(d){
  var t = new Date(d), n = new Date();
  return t.getFullYear()===n.getFullYear() && t.getMonth()===n.getMonth() && t.getDate()===n.getDate();
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderList(){
  var filter = document.getElementById('courseFilter').value;
  var rows = filter ? allRows.filter(function(r){ return String(r.course) === filter; }) : allRows;
  document.getElementById('statTotal').textContent = rows.length + '명';
  document.getElementById('statToday').textContent = rows.filter(function(r){ return isToday(r.time); }).length + '명';
  document.getElementById('statLast').textContent = rows.length ? fmt(rows[0].time) : '—';
  var area = document.getElementById('listArea');
  if(!rows.length){
    area.innerHTML = '<div class="empty">아직 제출한 수강생이 없습니다.<br>실습 페이지에서 모든 단계를 완료하면 제출 버튼이 열립니다.</div>';
    return;
  }
  var now = Date.now();
  var html = '<table><tr><th>번호</th><th>이름</th><th>실습</th><th>제출 시각</th></tr>';
  rows.forEach(function(r, i){
    var recent = (now - new Date(r.time).getTime()) < 10*60*1000;
    html += '<tr><td class="no">'+(rows.length - i)+'</td><td><strong>'+esc(r.name)+'</strong>'
      + (recent?'<span class="badge-new">방금</span>':'')
      + '</td><td>'+esc(r.course||'')+'</td><td class="time">'+fmt(r.time)+'</td></tr>';
  });
  html += '</table>';
  area.innerHTML = html;
}

function updateCourseFilter(){
  var sel = document.getElementById('courseFilter');
  var current = sel.value;
  var courses = [];
  allRows.forEach(function(r){
    var c = String(r.course||'');
    if(c && courses.indexOf(c) === -1) courses.push(c);
  });
  courses.sort();
  sel.innerHTML = '<option value="">전체 실습</option>' + courses.map(function(c){
    return '<option value="'+esc(c)+'">'+esc(c)+'</option>';
  }).join('');
  sel.value = current && courses.indexOf(current) !== -1 ? current : '';
}

function load(){
  if(loading) return;
  loading = true;
  document.getElementById('statusText').textContent = '불러오는 중...';
  fetch(API_URL).then(function(r){ return r.json(); }).then(function(rows){
    document.getElementById('errBox').classList.remove('show');
    rows.sort(function(a,b){ return new Date(b.time) - new Date(a.time); });
    allRows = rows;
    updateCourseFilter();
    renderList();
    document.getElementById('statusText').textContent = '마지막 갱신: ' + new Date().toLocaleTimeString('ko-KR');
  }).catch(function(){
    document.getElementById('errBox').classList.add('show');
    document.getElementById('statusText').textContent = '';
  }).finally(function(){ loading = false; });
}

document.getElementById('refreshBtn').addEventListener('click', load);
document.getElementById('courseFilter').addEventListener('change', renderList);
load();
setInterval(load, 30000);
</script>
</body>
</html>
